<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/base :: head('Competición')}"></th:block></head>
<body>
<div th:replace="~{fragments/encabezado :: barra}"></div>
<main class="container pb-5" style="max-width:640px">
  <div th:replace="~{fragments/base :: hero('Competición','Datos del torneo','🏆')}"></div>
  <div class="card"><div class="card-body">
    <form th:action="@{${accion}}" th:object="${competicion}" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombre}">Valor no válido</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="montoPremio">Monto del premio</label>
        <input type="number" class="form-control" th:field="*{montoPremio}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{montoPremio}">Valor no válido</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="fechaInicio">Fecha de inicio</label>
        <input type="date" class="form-control" th:field="*{fechaInicio}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{fechaInicio}">Valor no válido</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="fechaFin">Fecha de fin</label>
        <input type="date" class="form-control" th:field="*{fechaFin}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{fechaFin}">Valor no válido</div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        <a href="/competiciones" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/base :: scripts}"></th:block>
</body></html>
