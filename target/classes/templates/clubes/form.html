<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/base :: head('Club')}"></th:block></head>
<body>
<div th:replace="~{fragments/encabezado :: barra}"></div>
<main class="container pb-5" style="max-width:760px">
  <div th:replace="~{fragments/base :: hero('Club','Datos del club y sus relaciones','🛡️')}"></div>
  <div class="card"><div class="card-body">
    <form th:action="@{${accion}}" th:object="${clubForm}" method="post" novalidate>
      <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
        <div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombre}">Valor no válido</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="entrenadorId">Entrenador <span class="badge text-bg-light">@OneToOne</span></label>
        <select class="form-select" th:field="*{entrenadorId}">
          <option value="">— Sin entrenador —</option>
          <option th:each="e : ${entrenadores}" th:value="${e.id}" th:text="${e.nombre + ' ' + e.apellido}">Entrenador</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" for="asociacionId">Asociación <span class="badge text-bg-light">@ManyToOne</span></label>
        <select class="form-select" th:field="*{asociacionId}">
          <option value="">— Sin asociación —</option>
          <option th:each="a : ${asociaciones}" th:value="${a.id}" th:text="${a.nombre}">Asociación</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Jugadores <span class="badge text-bg-light">@OneToMany</span></label>
        <div class="border rounded p-2" style="max-height:200px;overflow:auto">
          <div class="form-check" th:each="j : ${jugadores}">
            <input class="form-check-input" type="checkbox" th:field="*{jugadoresIds}" th:value="${j.id}">
            <label class="form-check-label" th:for="${#ids.prev('jugadoresIds')}"
                   th:text="'#' + ${j.numero} + ' ' + ${j.nombre} + ' ' + ${j.apellido} + ' · ' + ${j.posicion}">Jugador</label>
          </div>
          <div class="text-secondary small" th:if="${#lists.isEmpty(jugadores)}">No hay jugadores registrados.</div>
        </div>
        <div class="form-text">Un jugador solo puede pertenecer a un club.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Competiciones <span class="badge text-bg-light">@ManyToMany</span></label>
        <div class="border rounded p-2" style="max-height:200px;overflow:auto">
          <div class="form-check" th:each="k : ${competiciones}">
            <input class="form-check-input" type="checkbox" th:field="*{competicionesIds}" th:value="${k.id}">
            <label class="form-check-label" th:for="${#ids.prev('competicionesIds')}" th:text="${k.nombre}">Competición</label>
          </div>
          <div class="text-secondary small" th:if="${#lists.isEmpty(competiciones)}">No hay competiciones registradas.</div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        <a href="/clubes" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/base :: scripts}"></th:block>
</body></html>
