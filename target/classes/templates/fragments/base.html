<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Dentro de <head>: <th:block th:replace="~{fragments/base :: head('Titulo')}"></th:block> -->
<th:block th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Liga de Fútbol'">Liga de Fútbol</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/liga.css}" href="/css/liga.css">
</th:block>

<!-- Banner con marcas de cancha: ~{fragments/base :: hero('Titulo','Subtitulo','⚽')} -->
<section th:fragment="hero(titulo, subtitulo, icono)" class="hero-cancha">
  <div class="hero-cancha__icono" th:text="${icono}">⚽</div>
  <div>
    <div class="hero-cancha__etiqueta">Liga de Fútbol</div>
    <h1 th:text="${titulo}">Título</h1>
    <p th:text="${subtitulo}">Subtítulo</p>
  </div>
</section>

<!-- Mensajes flash (ok / error) que dejan los controladores web -->
<th:block th:fragment="mensajes">
  <div class="alert alert-success alert-dismissible fade show" th:if="${ok}">
    ✅ <span th:text="${ok}">Operación realizada</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
    🟥 <span th:text="${error}">Error</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
</th:block>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
