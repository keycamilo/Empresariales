<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/base :: head('Asociación')}"></th:block></head>
<body>
<div th:replace="~{fragments/encabezado :: barra}"></div>
<main class="container pb-5">
  <div th:replace="~{fragments/base :: hero('Asociación','Ficha y clubes relacionados','🏛️')}"></div>
  <div th:replace="~{fragments/base :: mensajes}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="h4 mb-0" th:text="${asociacion.nombre}">Nombre</h2>
    <div class="d-flex gap-2">
      <a th:href="@{/asociaciones/{id}/editar(id=${asociacion.id})}" class="btn btn-outline-secondary">✏️ Editar</a>
      <a href="/asociaciones" class="btn btn-primary">⬅ Volver</a>
    </div>
  </div>
  <div class="card mb-4"><div class="card-body d-flex gap-3 align-items-center flex-wrap">
    <div class="medalla">🏛️</div>
    <div class="datos">
      <div>🌎 País: <strong th:text="${asociacion.pais}">-</strong></div>
      <div>🎙️ Presidente: <strong th:text="${asociacion.presidente}">-</strong></div>
    </div>
  </div></div>
  <h2 class="h5">🛡️ Clubes</h2>
  <div th:if="${!#lists.isEmpty(clubes)}">
    <a class="chip-club" th:each="c : ${clubes}" th:href="@{/clubes/{id}(id=${c.id})}">
      <div class="escudo" th:classappend="'tone-' + ${#strings.length(c.nombre) % 6}" th:text="${#strings.toUpperCase(#strings.substring(c.nombre,0,1))}">C</div>
      <span th:text="${c.nombre}">Club</span>
    </a>
  </div>
  <div class="vacio" th:if="${#lists.isEmpty(clubes)}">Ningún club está afiliado a esta asociación.</div>
</main>
<th:block th:replace="~{fragments/base :: scripts}"></th:block>
</body></html>
