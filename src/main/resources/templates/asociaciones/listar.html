<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/base :: head('Asociaciones')}"></th:block></head>
<body>
<div th:replace="~{fragments/encabezado :: barra}"></div>
<main class="container pb-5">
  <div th:replace="~{fragments/base :: hero('Asociaciones','Las federaciones que agrupan a los clubes','🏛️')}"></div>
  <div th:replace="~{fragments/base :: mensajes}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="text-secondary"><strong th:text="${#lists.size(asociaciones)}">0</strong> registrados</div>
    <a href="/asociaciones/nuevo" class="btn btn-primary">🏛️ Nueva asociación</a>
  </div>
  <div class="row g-3">
    <div class="col-md-6 col-xl-4" th:each="a : ${asociaciones}">
      <article class="tarjeta">
        <div class="d-flex gap-3 align-items-center">
          <div class="medalla">🏛️</div>
          <div>
            <h2 th:text="${a.nombre}">Nombre</h2>
            <div class="sub" th:text="${a.pais}">País</div>
          </div>
        </div>
        <ul class="datos">
          <li>🎙️ Presidente: <strong th:text="${a.presidente}">-</strong></li>
        </ul>
      <div class="tarjeta__acciones">
        <a th:href="@{/asociaciones/{id}(id=${a.id})}" class="btn btn-sm btn-outline-primary">👁️ Ver</a>
        <a th:href="@{/asociaciones/{id}/editar(id=${a.id})}" class="btn btn-sm btn-outline-secondary">✏️ Editar</a>
        <form th:action="@{/asociaciones/{id}/eliminar(id=${a.id})}" method="post"
              onsubmit="return confirm('¿Eliminar este registro?')">
          <button class="btn btn-sm btn-outline-danger">🟥 Eliminar</button>
        </form>
      </div>
      </article>
    </div>
  </div>
  <div class="vacio" th:if="${#lists.isEmpty(asociaciones)}"><div class="grande">🏛️</div>No hay asociaciones registradas.</div>
</main>
<th:block th:replace="~{fragments/base :: scripts}"></th:block>
</body></html>
